<section id="ana-sayfa" class="scroll-mt-24 overflow-hidden bg-slate-50">
  <div class="mx-auto grid max-w-7xl items-center gap-10 px-5 py-12 sm:px-6 sm:py-16 lg:grid-cols-[0.88fr_1.12fr] lg:gap-14 lg:px-8 lg:py-20">
    <div>
      <p class="mb-4 flex items-center gap-2 text-sm font-bold uppercase tracking-[0.14em] text-blue-700"><span class="h-px w-8 bg-blue-700"></span>İstanbul içi tesisat hizmeti</p>
      <h1 class="max-w-2xl text-4xl font-extrabold leading-[1.1] tracking-tight text-slate-950 sm:text-5xl lg:text-[3.45rem]">Profesyonel tesisat hizmetleri</h1>
      <p class="mt-6 max-w-xl text-lg leading-8 text-slate-600">Su tesisatı, kaçak tespiti, gider açma ve onarım ihtiyaçlarınız için hızlı, temiz ve güvenilir çözümler.</p>
      <div class="mt-8 flex flex-col gap-3 sm:flex-row">
        <a [href]="business.phoneHref" class="btn-primary">
          <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current" stroke-width="2"><path d="M6.6 2.8 9.2 8 6.8 9.8c1.3 2.8 3.6 5.1 6.4 6.4l1.8-2.4 5.2 2.6v3a1.8 1.8 0 0 1-1.8 1.8C9.8 20.7 3.3 14.2 2.8 5.6A1.8 1.8 0 0 1 4.6 3h2Z"/></svg>
          Hemen Ara
        </a>
        <a [href]="business.whatsappHref" target="_blank" rel="noopener noreferrer" class="btn-secondary" aria-label="WhatsApp üzerinden iletişime geç (yeni sekmede açılır)">
          <svg viewBox="0 0 24 24" class="size-4 fill-current" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48a9 9 0 0 1-1.66-2.07c-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.04 21.5h-.01a9.58 9.58 0 0 1-4.88-1.34l-.35-.21-3.63.95.97-3.54-.23-.36a9.58 9.58 0 1 1 8.13 4.5m8.15-17.75A11.45 11.45 0 0 0 2.18 17.56L.55 23.5l6.08-1.6a11.45 11.45 0 0 0 5.4 1.38h.01A11.46 11.46 0 0 0 20.2 3.75"/></svg>
          WhatsApp'tan Ulaş
        </a>
      </div>
      <div class="mt-8 flex flex-wrap gap-x-6 gap-y-2 border-t border-slate-200 pt-5 text-sm font-semibold text-slate-600">
        <span class="flex items-center gap-2"><span class="text-blue-700" aria-hidden="true">✓</span> İstanbul içi servis</span>
        <span class="flex items-center gap-2"><span class="text-blue-700" aria-hidden="true">✓</span> Yerinde inceleme</span>
        <span class="flex items-center gap-2"><span class="text-blue-700" aria-hidden="true">✓</span> Temiz işçilik</span>
      </div>
    </div>

    <div class="relative">
      <div class="absolute -bottom-4 -left-4 hidden h-24 w-24 border-b-4 border-l-4 border-blue-700 lg:block" aria-hidden="true"></div>
      <img src="/assets/images/idris.webp" alt="İdris Erisoylu" width="1073" height="1465" fetchpriority="high" class="aspect-[4/3] w-full rounded-lg object-cover object-[center_38%] shadow-lg lg:aspect-[1.2/1]" />
      <div class="absolute bottom-4 left-4 right-4 rounded-md bg-slate-950/90 px-5 py-4 text-white sm:left-6 sm:right-auto">
        <p class="text-xs font-bold uppercase tracking-widest text-blue-300">Servis bölgesi</p>
        <p class="mt-1 text-sm font-semibold sm:text-base">{{ business.serviceArea }}</p>
      </div>
    </div>
  </div>
</section>
