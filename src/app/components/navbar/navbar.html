<header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur-sm">
  <nav class="mx-auto flex h-18 max-w-7xl items-center justify-between px-5 sm:px-6 lg:px-8" aria-label="Ana menü">
    <a href="#ana-sayfa" class="flex items-center gap-3 text-slate-950" (click)="closeMenu()">
      <span class="grid size-10 place-items-center rounded-md bg-blue-700 text-white" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="size-6 fill-none stroke-current" stroke-width="1.8"><path d="M12 2.8S6.2 9.2 6.2 14a5.8 5.8 0 0 0 11.6 0C17.8 9.2 12 2.8 12 2.8Z"/><path d="M9.4 14.4a2.8 2.8 0 0 0 2.8 2.8"/></svg>
      </span>
      <span class="leading-tight"><strong class="block text-[15px] tracking-tight">{{ business.shortName }}</strong><span class="block text-xs text-slate-500">Su tesisatı ve onarım</span></span>
    </a>

    <div class="hidden items-center gap-7 lg:flex">
      <a class="nav-link" href="#ana-sayfa">Ana Sayfa</a>
      <a class="nav-link" href="#hizmetler">Hizmetler</a>
      <a class="nav-link" href="#hakkimizda">Hakkımızda</a>
      <a class="nav-link" href="#neden-biz">Neden Biz?</a>
      <a class="nav-link" href="#iletisim">İletişim</a>
      <a [href]="business.phoneHref" class="inline-flex items-center gap-2 rounded-md bg-blue-700 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
        <svg viewBox="0 0 24 24" class="size-4 fill-none stroke-current" stroke-width="2"><path d="M6.6 2.8 9.2 8 6.8 9.8c1.3 2.8 3.6 5.1 6.4 6.4l1.8-2.4 5.2 2.6v3a1.8 1.8 0 0 1-1.8 1.8C9.8 20.7 3.3 14.2 2.8 5.6A1.8 1.8 0 0 1 4.6 3h2Z"/></svg>
        Hemen Ara
      </a>
    </div>

    <button type="button" class="grid size-11 place-items-center rounded-md border border-slate-300 text-slate-800 lg:hidden" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-menu" aria-label="Menüyü aç veya kapat" (click)="toggleMenu()">
      @if (menuOpen()) {
        <svg viewBox="0 0 24 24" class="size-6 fill-none stroke-current" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" class="size-6 fill-none stroke-current" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      }
    </button>
  </nav>

  @if (menuOpen()) {
    <div id="mobile-menu" class="absolute left-0 top-full w-full border-t border-slate-200 bg-white px-5 py-4 shadow-lg lg:hidden">
      <div class="mx-auto grid max-w-7xl gap-1">
        <a class="mobile-nav-link" href="#ana-sayfa" (click)="closeMenu()">Ana Sayfa</a>
        <a class="mobile-nav-link" href="#hizmetler" (click)="closeMenu()">Hizmetler</a>
        <a class="mobile-nav-link" href="#hakkimizda" (click)="closeMenu()">Hakkımızda</a>
        <a class="mobile-nav-link" href="#neden-biz" (click)="closeMenu()">Neden Biz?</a>
        <a class="mobile-nav-link" href="#iletisim" (click)="closeMenu()">İletişim</a>
        <a [href]="business.phoneHref" class="mt-2 rounded-md bg-blue-700 px-4 py-3 text-center text-sm font-bold text-white">Hemen Ara</a>
      </div>
    </div>
  }
</header>
