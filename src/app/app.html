<div class="fixed bottom-5 right-5 z-40 flex flex-col items-center gap-3 sm:bottom-7 sm:right-7">
  @if (showScrollTop) {
    <button
      type="button"
      class="flex size-10 cursor-pointer items-center justify-center rounded-full bg-slate-900 text-white shadow-md ring-1 ring-white/10 transition hover:-translate-y-0.5 hover:bg-blue-700 hover:shadow-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700"
      aria-label="Sayfanın en üstüne dön"
      title="En üste dön"
      (click)="scrollToTop()"
    >
      <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 14 6-6 6 6" />
      </svg>
    </button>
  }

  <a
